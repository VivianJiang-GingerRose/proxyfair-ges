name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --with test

      - name: Validate project metadata and lockfile
        run: poetry check --lock

      - name: Run test suite
        run: poetry run pytest tests/synthetic -q

      - name: Run reviewer-facing demo
        run: poetry run python examples/demo_proxyfair.py
