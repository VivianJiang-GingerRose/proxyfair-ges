[tool.poetry]
name = "faircausaldiscovery"
version = "0.1.0"
description = "causal discovery with fairness evaluation and causal reasoning from llm"
authors = ["Anonymous"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pydot = "^3.0.3"
numpy = "<2.0"
pandas = "^2.2.3"
networkx = "^3.4.2"
notebook = "^7.3.1"
ipykernel = "^6.29.5"
pgmpy = "^1.0.0"
console = "^0.9911"
fairlearn = "^0.12.0"
xgboost = "^3.0.0"
dowhy = "^0.12"
scipy = "1.12.0"
aif360 = "^0.6.1"
openai = "^1.58.1"
anthropic = "^0.75.0"
google-generativeai = "^0.8.3"
python-dotenv = "^1.0.0"
google-genai = "^1.56.0"
seaborn = "^0.13.2"
matplotlib = "^3.10.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
